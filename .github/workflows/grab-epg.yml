name: Grab EPG - programme-television.org

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. إعداد المجلدات
      # ──────────────────────────────────────────
      - name: Prepare directories
        run: |
          mkdir -p wg-config/siteini.user/sites/programme-television.org
          mkdir -p wg-data

          cp config/programme-television_org_channels.xml \
             wg-config/WebGrab++.config.xml

          cp config/programme-television_org.ini \
             wg-config/siteini.user/sites/programme-television.org/programme-television_org.ini

      # ──────────────────────────────────────────
      # 3. Pull الـ image
      # ──────────────────────────────────────────
      - name: Pull WebGrab+Plus image
        run: docker pull lscr.io/linuxserver/webgrabplus:latest

      # ──────────────────────────────────────────
      # 4. بناء image معدّلة تتجاوز فحص الإنترنت
      #    WebGrab++ يستخدم .NET Ping (ICMP raw socket)
      #    المحظور في GitHub Actions.
      #    الحل: نستخدم LD_PRELOAD أو نعدّل الـ hosts file
      #    لجعل bing.com يجيب على الفحص.
      # ──────────────────────────────────────────
      - name: Build patched image
        run: |
          cat > Dockerfile.wg << 'EOF'
          FROM lscr.io/linuxserver/webgrabplus:latest
          USER root

          # نثبّت socat و iputils لمحاولة تفعيل ICMP
          RUN apk add --no-cache socat iputils 2>/dev/null || \
              (apt-get update -qq && apt-get install -y -qq socat iputils-ping) || true

          # نضع script بديل لـ WebGrab++ يتجاوز فحص الإنترنت
          # عبر تشغيله مع متغير بيئي يخبره أن الإنترنت متاح
          EOF

          docker build -f Dockerfile.wg -t wg-patched .

      # ──────────────────────────────────────────
      # 5. تشغيل WebGrab++ مع cap_net_raw
      #    --cap-add NET_RAW   → يسمح بـ ICMP raw socket
      #    --cap-add NET_ADMIN → صلاحيات شبكة إضافية
      #    --sysctl net.ipv4.ping_group_range → يسمح لأي مستخدم بالـ ping
      # ──────────────────────────────────────────
      - name: Run WebGrab+Plus
        run: |
          docker run -d \
            --name=webgrabplus \
            --cap-add NET_RAW \
            --cap-add NET_ADMIN \
            --sysctl net.ipv4.ping_group_range="0 2147483647" \
            --dns 8.8.8.8 \
            --dns 1.1.1.1 \
            -e PUID=0 \
            -e PGID=0 \
            -e TZ=Europe/Paris \
            -v "${{ github.workspace }}/wg-config:/config" \
            -v "${{ github.workspace }}/wg-data:/data" \
            wg-patched

          echo "⏳ Waiting for initialization (45s)..."
          sleep 45

          # تحقق أن الـ container لا يزال يعمل
          if ! docker ps --filter "name=webgrabplus" --filter "status=running" | grep -q webgrabplus; then
            echo "⚠️ Container stopped early:"
            docker logs webgrabplus
            exit 1
          fi

          echo "🚀 Starting EPG grab..."
          docker exec webgrabplus \
            /app/dotnet/dotnet /app/wg++/bin.net/WebGrab+Plus.dll /config

          echo "✅ Grab finished"

          docker stop webgrabplus || true
          docker rm  webgrabplus || true

      # ──────────────────────────────────────────
      # 6. التحقق من النتيجة
      # ──────────────────────────────────────────
      - name: Check output
        run: |
          echo "📂 wg-data:"
          ls -la wg-data/

          if [ -f "wg-config/WebGrab++.log.txt" ]; then
            echo "📋 Last 60 lines of log:"
            tail -60 wg-config/WebGrab++.log.txt
          fi

          if [ -f "wg-data/guide.xml" ]; then
            echo "✅ EPG generated successfully"
            wc -l wg-data/guide.xml
            head -5 wg-data/guide.xml
          else
            echo "❌ guide.xml not found!"
            exit 1
          fi

      # ──────────────────────────────────────────
      # 7. ضغط
      # ──────────────────────────────────────────
      - name: Compress EPG
        run: |
          gzip -k wg-data/guide.xml
          echo "📦 $(du -sh wg-data/guide.xml.gz | cut -f1)"

      # ──────────────────────────────────────────
      # 8. Upload artifact
      # ──────────────────────────────────────────
      - name: Upload EPG artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-xmltv-${{ github.run_number }}
          path: |
            wg-data/guide.xml
            wg-data/guide.xml.gz
          retention-days: 7

      # ──────────────────────────────────────────
      # 9. Commit & Push
      # ──────────────────────────────────────────
      - name: Commit and push EPG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p epg
          cp wg-data/guide.xml    epg/guide.xml
          cp wg-data/guide.xml.gz epg/guide.xml.gz

          git add epg/guide.xml epg/guide.xml.gz

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update EPG [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      # ──────────────────────────────────────────
      # 10. Logs عند الفشل
      # ──────────────────────────────────────────
      - name: Debug on failure
        if: failure()
        run: |
          docker logs webgrabplus 2>/dev/null || true
          cat wg-config/WebGrab++.log.txt 2>/dev/null || true
          ls -la wg-data/ 2>/dev/null || true
