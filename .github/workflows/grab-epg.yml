name: Grab EPG - programme-television.org

on:
  schedule:
    - cron: '0 4 * * *'  # كل يوم الساعة 04:00 UTC
  workflow_dispatch:  # تشغيل يدوي

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare WebGrab+Plus directories
        run: |
          mkdir -p wg-config/siteini.user/sites/programme-television.org
          mkdir -p wg-data
          cp config/programme-television_org_channels.xml wg-config/WebGrab++.config.xml
          cp config/programme-television_org.ini wg-config/siteini.user/sites/programme-television.org/

      - name: Pull WebGrab+Plus image
        run: docker pull lscr.io/linuxserver/webgrabplus:latest

      - name: Test Internet connectivity
        run: |
          echo "🔍 Checking Internet..."
          if ping -c 2 google.com; then
            echo "✅ Internet is available"
          else
            echo "❌ No Internet detected, aborting workflow"
            exit 1
          fi

      - name: Run WebGrab+Plus
        run: |
          docker run -d \
            --name=webgrabplus \
            --network host \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Europe/Paris \
            -v "${{ github.workspace }}/wg-config:/config" \
            -v "${{ github.workspace }}/wg-data:/data" \
            lscr.io/linuxserver/webgrabplus:latest

          echo "⏳ Waiting for WebGrab+Plus to initialize..."
          sleep 30

          echo "🚀 Starting EPG grab..."
          docker exec webgrabplus /app/dotnet/dotnet /app/wg++/bin.net/WebGrab+Plus.dll /config

          echo "✅ Grab completed"

          docker stop webgrabplus
          docker rm webgrabplus

      - name: Check output
        run: |
          echo "📂 Contents of wg-data:"
          ls -la wg-data/ || echo "(empty)"
          if [ -f "wg-data/guide.xml" ]; then
            echo "✅ EPG generated successfully"
            tail -30 wg-config/WebGrab++.log.txt
          else
            echo "❌ guide.xml not found!"
            exit 1
          fi

      - name: Compress EPG output
        run: gzip -k wg-data/guide.xml

      - name: Upload EPG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-xmltv-${{ github.run_number }}
          path: |
            wg-data/guide.xml
            wg-data/guide.xml.gz
          retention-days: 7

      - name: Commit and push EPG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p epg
          cp wg-data/guide.xml     epg/guide.xml
          cp wg-data/guide.xml.gz  epg/guide.xml.gz
          git add epg/guide.xml epg/guide.xml.gz
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update EPG [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
