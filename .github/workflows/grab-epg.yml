name: Grab EPG - programme-television.org

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────
      # 1. Checkout المستودع
      # ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. إعداد مجلدات WebGrab+Plus
      # ──────────────────────────────────────────
      - name: Prepare WebGrab+Plus directories
        run: |
          mkdir -p wg-config/siteini.user/sites/programme-television.org
          mkdir -p wg-data

          cp config/programme-television_org_channels.xml \
             wg-config/WebGrab++.config.xml

          cp config/programme-television_org.ini \
             wg-config/siteini.user/sites/programme-television.org/programme-television_org.ini

      # ──────────────────────────────────────────
      # 3. اختبار الاتصال بالإنترنت من الـ runner
      # ──────────────────────────────────────────
      - name: Verify internet connectivity
        run: |
          curl -s --max-time 10 https://www.google.com -o /dev/null && echo "✅ Internet OK" || echo "❌ No Internet"
          nslookup programme-television.org || true

      # ──────────────────────────────────────────
      # 4. Pull الـ image
      # ──────────────────────────────────────────
      - name: Pull WebGrab+Plus image
        run: docker pull lscr.io/linuxserver/webgrabplus:latest

      # ──────────────────────────────────────────
      # 5. تشغيل WebGrab+Plus
      #    - نبني Dockerfile مؤقت يثبّت ping أولاً
      #      لأن GitHub Actions يمنع ICMP/ping الأصلي
      #    - نستخدم --dns صريح لضمان DNS داخل الـ container
      # ──────────────────────────────────────────
      - name: Build patched WebGrab+Plus image
        run: |
          cat > Dockerfile.wg << 'EOF'
          FROM lscr.io/linuxserver/webgrabplus:latest
          USER root
          RUN apk add --no-cache iputils || \
              apt-get update -qq && apt-get install -y -qq iputils-ping || true
          EOF
          docker build -f Dockerfile.wg -t webgrabplus-patched . || \
            echo "Patch failed, using original image"

      - name: Run WebGrab+Plus
        run: |
          # نحاول أولاً بالصورة المعدّلة، ثم الأصلية كـ fallback
          IMAGE="webgrabplus-patched"
          docker image inspect "$IMAGE" > /dev/null 2>&1 || IMAGE="lscr.io/linuxserver/webgrabplus:latest"

          echo "🐳 Using image: $IMAGE"

          docker run -d \
            --name=webgrabplus \
            --dns 8.8.8.8 \
            --dns 1.1.1.1 \
            -e PUID=0 \
            -e PGID=0 \
            -e TZ=Europe/Paris \
            -v "${{ github.workspace }}/wg-config:/config" \
            -v "${{ github.workspace }}/wg-data:/data" \
            "$IMAGE"

          echo "⏳ Waiting for container to initialize (45s)..."
          sleep 45

          # تحقق أن الـ container لا يزال يعمل
          if ! docker ps --filter "name=webgrabplus" --filter "status=running" | grep -q webgrabplus; then
            echo "⚠️ Container stopped early — checking logs..."
            docker logs webgrabplus
            exit 1
          fi

          echo "🚀 Starting EPG grab..."
          docker exec webgrabplus \
            /app/dotnet/dotnet /app/wg++/bin.net/WebGrab+Plus.dll /config

          echo "✅ Grab completed"

          docker stop webgrabplus
          docker rm webgrabplus

      # ──────────────────────────────────────────
      # 6. التحقق من النتيجة وعرض اللوغ
      # ──────────────────────────────────────────
      - name: Check output
        run: |
          echo "📂 Contents of wg-data:"
          ls -la wg-data/ || echo "(empty)"

          echo "📂 Contents of wg-config:"
          ls -la wg-config/

          if [ -f "wg-config/WebGrab++.log.txt" ]; then
            echo "📋 Last 50 lines of WebGrab++.log.txt:"
            tail -50 wg-config/WebGrab++.log.txt
          fi

          if [ -f "wg-data/guide.xml" ]; then
            echo "✅ EPG generated successfully"
            wc -l wg-data/guide.xml
            head -5 wg-data/guide.xml
          else
            echo "❌ guide.xml not found!"
            exit 1
          fi

      # ──────────────────────────────────────────
      # 7. ضغط الملف
      # ──────────────────────────────────────────
      - name: Compress EPG output
        run: |
          gzip -k wg-data/guide.xml
          echo "📦 Compressed: $(du -sh wg-data/guide.xml.gz | cut -f1)"

      # ──────────────────────────────────────────
      # 8. رفع EPG كـ Artifact
      # ──────────────────────────────────────────
      - name: Upload EPG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-xmltv-${{ github.run_number }}
          path: |
            wg-data/guide.xml
            wg-data/guide.xml.gz
          retention-days: 7

      # ──────────────────────────────────────────
      # 9. Commit & Push الـ EPG إلى المستودع
      # ──────────────────────────────────────────
      - name: Commit and push EPG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p epg
          cp wg-data/guide.xml     epg/guide.xml
          cp wg-data/guide.xml.gz  epg/guide.xml.gz

          git add epg/guide.xml epg/guide.xml.gz

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update EPG [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      # ──────────────────────────────────────────
      # 10. عرض الـ logs دائماً حتى عند الفشل
      # ──────────────────────────────────────────
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker logs ==="
          docker logs webgrabplus 2>/dev/null || true

          echo "=== WebGrab++ log ==="
          cat wg-config/WebGrab++.log.txt 2>/dev/null || true

          echo "=== wg-data contents ==="
          ls -la wg-data/ 2>/dev/null || true
