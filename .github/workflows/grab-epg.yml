name: EPG Collector CI

on:
  schedule:
    - cron: "0 2 * * *"  # تشغيل يومي الساعة 02:00 صباحاً
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Download EPG Collector
        run: |
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/epgcollector/files/latest/download" -OutFile epgcollector.zip
          Expand-Archive epgcollector.zip -DestinationPath epgcollector

      - name: Run EPG Collector
        run: |
          cd epgcollector
          .\EPGCollector.exe ^
            -ini ..\..\config\programme-television_org.ini ^
            -channels ..\..\config\programme-television_org_channels.xml ^
            -output ..\..\guide.xml

      - name: Upload Output
        uses: actions/upload-artifact@v3
        with:
          name: epg_xml
          path: guide.xml
