name: Update pickx.be EPG

on:
  schedule:
    # تشغيل يومي الساعة 04:00 UTC — عدّل حسب الحاجة
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-pickx-epg
  cancel-in-progress: true

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grab pickx.be EPG
        run: python3 grab_pickx_epg.py --output epg/pickx.be.xml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/pickx.be.xml
          if git diff --cached --quiet; then
            echo "Aucun changement dans le guide EPG."
          else
            git commit -m "chore: update pickx.be EPG [skip ci]"
            git push
          fi
