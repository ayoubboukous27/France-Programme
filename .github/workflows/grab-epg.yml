name: Grab EPG - programme-television.org

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────
      # 1. Checkout المستودع
      # ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. إعداد Node.js
      # ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ──────────────────────────────────────────
      # 3. Clone iptv-org/epg
      # ──────────────────────────────────────────
      - name: Clone iptv-org/epg
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git /tmp/epg
          cd /tmp/epg && npm install

      # ──────────────────────────────────────────
      # 4. التحقق أن programme-television.org موجود كـ site
      # ──────────────────────────────────────────
      - name: Check site support
        run: |
          if ls /tmp/epg/sites/programme-television.org* 2>/dev/null; then
            echo "✅ Site supported natively in iptv-org/epg"
          else
            echo "⚠️ Site not found — will use custom config"
          fi

      # ──────────────────────────────────────────
      # 5. إعداد channels.xml
      #    إذا كان لديك ملف channels جاهز في المستودع — نستخدمه
      #    وإلا نأخذه من iptv-org/epg مباشرةً
      # ──────────────────────────────────────────
      - name: Prepare channels file
        run: |
          mkdir -p /tmp/epg-output

          if [ -f "${{ github.workspace }}/config/channels.xml" ]; then
            echo "📋 Using custom channels.xml from repo"
            cp "${{ github.workspace }}/config/channels.xml" /tmp/epg/channels.xml
          elif [ -f "/tmp/epg/sites/programme-television.org/programme-television.org.channels.xml" ]; then
            echo "📋 Using iptv-org default channels.xml"
            cp /tmp/epg/sites/programme-television.org/programme-television.org.channels.xml \
               /tmp/epg/channels.xml
          else
            echo "❌ No channels file found!"
            ls /tmp/epg/sites/ | grep -i programme || true
            exit 1
          fi

          echo "📺 Channels to grab:"
          cat /tmp/epg/channels.xml

      # ──────────────────────────────────────────
      # 6. تشغيل الـ grabber
      # ──────────────────────────────────────────
      - name: Grab EPG
        run: |
          cd /tmp/epg

          npm run grab -- \
            --channels=channels.xml \
            --output=/tmp/epg-output/guide.xml \
            --days=7 \
            --delay=1000 \
            --timeout=30000 \
            --maxConnections=5

          echo "✅ Grab completed"

      # ──────────────────────────────────────────
      # 7. التحقق من النتيجة
      # ──────────────────────────────────────────
      - name: Check output
        run: |
          if [ -f "/tmp/epg-output/guide.xml" ]; then
            echo "✅ guide.xml generated:"
            wc -l /tmp/epg-output/guide.xml
            head -10 /tmp/epg-output/guide.xml
          else
            echo "❌ guide.xml not found!"
            ls -la /tmp/epg-output/
            exit 1
          fi

      # ──────────────────────────────────────────
      # 8. ضغط الملف
      # ──────────────────────────────────────────
      - name: Compress EPG
        run: |
          cp /tmp/epg-output/guide.xml /tmp/epg-output/guide.xml.bak
          gzip -k /tmp/epg-output/guide.xml
          echo "📦 Compressed: $(du -sh /tmp/epg-output/guide.xml.gz | cut -f1)"

      # ──────────────────────────────────────────
      # 9. Upload artifact
      # ──────────────────────────────────────────
      - name: Upload EPG artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-xmltv-${{ github.run_number }}
          path: |
            /tmp/epg-output/guide.xml
            /tmp/epg-output/guide.xml.gz
          retention-days: 7

      # ──────────────────────────────────────────
      # 10. Commit & Push إلى المستودع
      # ──────────────────────────────────────────
      - name: Commit and push EPG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p "${{ github.workspace }}/epg"
          cp /tmp/epg-output/guide.xml    "${{ github.workspace }}/epg/guide.xml"
          cp /tmp/epg-output/guide.xml.gz "${{ github.workspace }}/epg/guide.xml.gz"

          cd "${{ github.workspace }}"
          git add epg/guide.xml epg/guide.xml.gz

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update EPG [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      # ──────────────────────────────────────────
      # 11. Debug عند الفشل
      # ──────────────────────────────────────────
      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Sites available ==="
          ls /tmp/epg/sites/ | grep -i programme || echo "none found"

          echo "=== channels.xml ==="
          cat /tmp/epg/channels.xml 2>/dev/null || true

          echo "=== output dir ==="
          ls -la /tmp/epg-output/ 2>/dev/null || true
