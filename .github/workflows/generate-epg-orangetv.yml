name: Generate OrangeTV Spain EPG

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (لحفظ الناتج فيه)
        uses: actions/checkout@v4
        with:
          path: dest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python orchestrator script
        run: python dest/run_orangetv_epg.py --repo-dir epg-src --output-dir dest/output

      - name: Upload generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: orangetv-orange-es-epg
          path: |
            dest/output/orangetv.orange.es.epg.xml
            dest/output/orangetv.orange.es.channels.xml
          if-no-files-found: error

      - name: Commit generated files
        working-directory: dest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/orangetv.orange.es.epg.xml output/orangetv.orange.es.channels.xml
          git diff --staged --quiet || git commit -m "chore: regenerate orangetv.orange.es EPG + channels [skip ci]"
          git push
