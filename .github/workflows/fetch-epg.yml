name: Fetch Pickx EPG

on:
  schedule:
    # كل يوم عند 03:00 UTC (بعد تحديث iptv-org/epg الذي يعمل حوالي 00:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  fetch-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python fetch_pickx_epg.py --site pickx.be --out-dir epg

      - name: Upload EPG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickx-epg
          path: epg/*.xml
          if-no-files-found: warn

      - name: Commit updated EPG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/*.xml || true
          git diff --staged --quiet || git commit -m "chore: update pickx.be EPG [skip ci]"
          git push
